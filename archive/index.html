<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>歌枠の記録｜歌枠らいぶらり</title>
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <meta name="theme-color" content="#A85C83">
  <!-- OGP / X(Twitter) card: change the title/description/image URL as needed -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:site_name" content="歌枠らいぶらり">
  <meta property="og:title" content="歌枠らいぶらり">
  <meta property="og:description" content="個人VTuber〇〇さんの歌枠や歌った曲をまとめた、ファンメイドサイトです。">
  <meta property="og:image" content="https://example.com/assets/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="歌枠らいぶらり">
  <meta name="twitter:description" content="個人VTuber〇〇さんの歌枠や歌った曲をまとめた、ファンメイドサイトです。">
  <meta name="twitter:image" content="https://example.com/assets/social-card.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
<header>
  <a class="logo" href="../">歌枠らいぶらり</a>
  <nav><a href="./">ARCHIVE</a><a href="../songs/">SONGS</a></nav>
</header>

<main class="archiveIndexPage">
  <section class="archiveIndexHero">
    <div class="archiveIndexHeroInner">
      <p class="eyebrow">LIVE ARCHIVE</p>
      <h1>歌枠の記録</h1>
      <div class="pageTitleRule" aria-hidden="true"><span>◆</span></div>
      <p class="archiveLead">これまでの歌枠を、配信日ごとにまとめています。</p>
    </div>
  </section>

  <section class="section archiveIndexSection">
    <div class="archiveControls" aria-label="歌枠の並び替えと日付絞り込み">
      <div class="archiveControlBar">
        <label class="archiveSortControl" for="archiveSort">
          <span class="archiveControlCaption">並び順</span>
          <select id="archiveSort">
            <option value="desc">新しい順</option>
            <option value="asc">古い順</option>
          </select>
        </label>

        <button id="archiveFilterToggle" class="archiveFilterToggle" type="button" aria-expanded="false" aria-controls="archiveFilterPanel">
          日付で絞り込む<span id="archiveFilterToggleMark" class="archiveFilterToggleMark" aria-hidden="true">＋</span>
        </button>

        <div class="archiveMemberFilter" role="radiogroup" aria-label="メンバー限定配信">
          <span class="archiveMemberFilterTitle">メンバー限定配信：</span>
          <label><input type="radio" name="archiveMemberFilter" value="all" checked> すべて</label>
          <label><input type="radio" name="archiveMemberFilter" value="exclude"> 含まない</label>
          <label><input type="radio" name="archiveMemberFilter" value="only"> メン限のみ</label>
        </div>

        <p id="archiveResultCount" class="archiveResultCount" aria-live="polite"></p>
      </div>

      <div id="archiveFilterPanel" class="archiveFilterPanel" hidden>
        <div class="archiveFilterModes" role="radiogroup" aria-label="日付の絞り込み方法">
          <label class="archiveFilterMode"><input type="radio" name="archiveFilterMode" value="ymd" checked> 年月日から</label>
          <label class="archiveFilterMode"><input type="radio" name="archiveFilterMode" value="range"> 期間から</label>
          <button id="archiveFilterClear" class="archiveFilterClear archiveFilterClearShared" type="button">絞り込みを解除</button>
        </div>

        <div class="archiveFilterFields" data-filter-group="ymd">
          <label class="archiveFilterField">
            <span>年</span>
            <select id="archiveYear"><option value="">年を選ぶ</option></select>
          </label>
          <label class="archiveFilterField">
            <span>月</span>
            <select id="archiveMonth" disabled><option value="">すべての月</option></select>
          </label>
          <label class="archiveFilterField">
            <span>日</span>
            <select id="archiveDay" disabled><option value="">すべての日</option></select>
          </label>
        </div>

        <div class="archiveFilterFields" data-filter-group="range" hidden>
          <label class="archiveFilterField">
            <span>開始日</span>
            <input id="archiveStartDate" type="date">
          </label>
          <span class="archiveRangeDash" aria-hidden="true">〜</span>
          <label class="archiveFilterField">
            <span>終了日</span>
            <input id="archiveEndDate" type="date">
          </label>
        </div>
      </div>
    </div>

    <div id="archiveCards" class="cards archiveIndexCards"></div>
    <p id="archiveNoResults" class="archiveNoResults" hidden>該当する歌枠がありません。</p>
  </section>
</main>

<footer><b>歌枠らいぶらり</b><span>歌枠の記録</span></footer>

<script src="../data/archives.js"></script>
<script>
const root = document.getElementById("archiveCards");
const noResults = document.getElementById("archiveNoResults");
const resultCount = document.getElementById("archiveResultCount");
const sortSelect = document.getElementById("archiveSort");
const filterToggle = document.getElementById("archiveFilterToggle");
const filterToggleMark = document.getElementById("archiveFilterToggleMark");
const filterPanel = document.getElementById("archiveFilterPanel");
const filterModeInputs = [...document.querySelectorAll('input[name="archiveFilterMode"]')];
const ymdFields = document.querySelector('[data-filter-group="ymd"]');
const rangeFields = document.querySelector('[data-filter-group="range"]');
const yearSelect = document.getElementById("archiveYear");
const monthSelect = document.getElementById("archiveMonth");
const daySelect = document.getElementById("archiveDay");
const startDateInput = document.getElementById("archiveStartDate");
const endDateInput = document.getElementById("archiveEndDate");
const clearFilter = document.getElementById("archiveFilterClear");
const memberFilterInputs = [...document.querySelectorAll('input[name="archiveMemberFilter"]')];

const simpleKanji = "〇一二三四五六七八九";
const daiji = ["","壱","弐","参","肆","伍","陸","漆","捌","玖"];

function escapeHtml(value){
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

function formatArchiveDate(value){
  const [y,m,d] = value.split("-").map(Number);
  const year = String(y).split("").map(n => simpleKanji[Number(n)]).join("");
  const jpNumber = n => n < 10 ? simpleKanji[n]
    : n === 10 ? "十"
    : n < 20 ? "十" + simpleKanji[n - 10]
    : simpleKanji[Math.floor(n / 10)] + "十" + (n % 10 ? simpleKanji[n % 10] : "");
  return `${year}年 ${jpNumber(m)}月 ${jpNumber(d)}日`;
}

function formatDaijiCount(n){
  const units = [[10000,"萬"],[1000,"阡"],[100,"陌"],[10,"拾"]];
  n = Math.max(0, Math.floor(Number(n) || 0));
  if(n === 0) return "〇曲";

  let value = n;
  let result = "";
  units.forEach(([unit,label]) => {
    const digit = Math.floor(value / unit);
    if(digit > 0){
      result += daiji[digit] + label;
      value %= unit;
    }
  });
  if(value > 0) result += daiji[value];
  return result + "曲";
}

const archives = [...ARCHIVES].filter(a => /^\d{4}-\d{2}-\d{2}$/.test(a.date));

function dateParts(value){
  const [year, month, day] = value.split("-").map(Number);
  return {year, month, day};
}

function uniqueSorted(values){
  return [...new Set(values)].sort((a,b) => a - b);
}

function fillSelect(select, values, firstLabel, formatter){
  const current = select.value;
  select.innerHTML = `<option value="">${firstLabel}</option>` + values.map(value =>
    `<option value="${value}">${formatter(value)}</option>`
  ).join("");
  if(values.map(String).includes(current)) select.value = current;
}

function populateYears(){
  const years = uniqueSorted(archives.map(a => dateParts(a.date).year)).reverse();
  fillSelect(yearSelect, years, "年を選ぶ", y => `${y}年`);
}

function populateMonths(){
  const year = Number(yearSelect.value);
  const months = year
    ? uniqueSorted(archives.filter(a => dateParts(a.date).year === year).map(a => dateParts(a.date).month))
    : [];
  fillSelect(monthSelect, months, "すべての月", m => `${m}月`);
  monthSelect.disabled = !year;
  if(!year){
    monthSelect.value = "";
    daySelect.value = "";
  }
}

function populateDays(){
  const year = Number(yearSelect.value);
  const month = Number(monthSelect.value);
  const days = year && month
    ? uniqueSorted(archives.filter(a => {
        const p = dateParts(a.date);
        return p.year === year && p.month === month;
      }).map(a => dateParts(a.date).day))
    : [];
  fillSelect(daySelect, days, "すべての日", d => `${d}日`);
  daySelect.disabled = !(year && month);
  if(!(year && month)) daySelect.value = "";
}

function activeMode(){
  return filterModeInputs.find(input => input.checked)?.value || "ymd";
}

function activeMemberFilter(){
  return memberFilterInputs.find(input => input.checked)?.value || "all";
}

function hasActiveFilter(){
  const memberFiltered = activeMemberFilter() !== "all";
  if(activeMode() === "range") return memberFiltered || Boolean(startDateInput.value || endDateInput.value);
  return memberFiltered || Boolean(yearSelect.value || monthSelect.value || daySelect.value);
}

function matchesFilter(archive){
  const memberMode = activeMemberFilter();
  const isMembersOnly = archive.membersOnly === true;
  if(memberMode === "exclude" && isMembersOnly) return false;
  if(memberMode === "only" && !isMembersOnly) return false;

  if(activeMode() === "range"){
    const start = startDateInput.value;
    const end = endDateInput.value;
    if(start && archive.date < start) return false;
    if(end && archive.date > end) return false;
    return true;
  }

  const {year,month,day} = dateParts(archive.date);
  if(yearSelect.value && year !== Number(yearSelect.value)) return false;
  if(monthSelect.value && month !== Number(monthSelect.value)) return false;
  if(daySelect.value && day !== Number(daySelect.value)) return false;
  return true;
}

const openArchiveDates = new Set();

function formatTimestamp(seconds){
  const total = Math.max(0, Math.floor(Number(seconds) || 0));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  return `${String(hours).padStart(2,"0")}:${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;
}

function makeYouTubeUrl(videoId, seconds = 0){
  const id = encodeURIComponent(String(videoId || ""));
  const base = `https://www.youtube.com/watch?v=${id}`;
  const t = Math.max(0, Math.floor(Number(seconds) || 0));
  return t > 0 ? `${base}&t=${t}s` : base;
}

function makeSongHistoryUrl(title, artist){
  const params = new URLSearchParams({song:String(title || ""), artist:String(artist || "")});
  return `../songs/history/?${params.toString()}`;
}

function makeArtistUrl(artist){
  return `../artists/?artist=${encodeURIComponent(String(artist || ""))}`;
}

function archiveCard(a){
  const songs = a.songs.filter(s => s.type === "song");
  const isOpen = openArchiveDates.has(a.date);
  const panelId = `archive-panel-${a.date}`;
  const songRows = songs.map((song, index) => `
    <li class="archiveAccordionSong">
      <div class="archiveSongTop">
        <span class="archiveSongNumber">${String(index + 1).padStart(2,"0")}</span>
        <a class="archiveSongTime" data-archive-tooltip="該当箇所をYouTubeで開く" href="${makeYouTubeUrl(a.videoId, song.time)}" target="_blank" rel="noopener noreferrer">${formatTimestamp(song.time)} ↗</a>
      </div>
      <a class="archiveSongTitle" data-archive-tooltip="この曲の歌唱履歴を確認" href="${makeSongHistoryUrl(song.title, song.artist)}">${escapeHtml(song.title)}</a>
      <a class="archiveSongArtist" data-archive-tooltip="この歌手の他の曲を見る" href="${makeArtistUrl(song.artist)}">${escapeHtml(song.artist || "未登録")}</a>
    </li>
  `).join("");

  return `<article class="card archiveIndexCard${isOpen ? " is-open" : ""}" id="${a.date}" data-archive-date="${a.date}">
    <button class="archiveCardToggle" type="button" aria-expanded="${isOpen}" aria-controls="${panelId}">
      <span class="archiveCardDateLine">
        <span class="card-date">${formatArchiveDate(a.date)}</span>
        ${a.membersOnly === true ? '<span class="memberBadge">メン限</span>' : ''}
      </span>
      <span class="archiveCardTitle">${escapeHtml(a.title)}</span>
      <span class="card-meta">${formatDaijiCount(songs.length)}</span>
      <span class="archiveCardArrow" aria-hidden="true">${isOpen ? "⌃" : "⌄"}</span>
    </button>
    <div class="archiveCardCollapse" id="${panelId}" aria-hidden="${isOpen ? "false" : "true"}">
      <div class="archiveCardBody">
        <div class="archiveCardBodyInner">
          <a class="archiveYoutubeLink" href="${makeYouTubeUrl(a.videoId)}" target="_blank" rel="noopener noreferrer">YouTubeで配信を見る ↗</a>
          <ol class="archiveAccordionSetlist">
            ${songRows}
          </ol>
        </div>
      </div>
    </div>
  </article>`;
}

function renderArchives(){
  const direction = sortSelect.value === "asc" ? 1 : -1;
  const visible = archives
    .filter(matchesFilter)
    .sort((a,b) => a.date.localeCompare(b.date) * direction);

  root.innerHTML = visible.map(archiveCard).join("");
  noResults.hidden = visible.length !== 0;

  if(hasActiveFilter()){
    resultCount.innerHTML = `全${archives.length}件中 <strong>${visible.length}件表示</strong>`;
  }else{
    resultCount.innerHTML = `<strong>全${archives.length}件</strong>`;
  }
}

function setArchiveOpen(date, shouldOpen){
  if(shouldOpen) openArchiveDates.add(date);
  else openArchiveDates.delete(date);

  const card = document.getElementById(date);
  if(!card) return;
  const toggle = card.querySelector(".archiveCardToggle");
  const arrow = card.querySelector(".archiveCardArrow");
  const panel = card.querySelector(".archiveCardCollapse");
  card.classList.toggle("is-open", shouldOpen);
  toggle?.setAttribute("aria-expanded", String(shouldOpen));
  panel?.setAttribute("aria-hidden", String(!shouldOpen));
  if(arrow) arrow.textContent = shouldOpen ? "⌃" : "⌄";
}

function openArchiveFromHash({scroll = true} = {}){
  const raw = location.hash.slice(1);
  let date = "";
  try{ date = decodeURIComponent(raw); }catch{ date = raw; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  if(!archives.some(a => a.date === date)) return;

  setArchiveOpen(date, true);
  if(scroll){
    requestAnimationFrame(() => {
      document.getElementById(date)?.scrollIntoView({behavior:"smooth", block:"start"});
    });
  }
}

function setFilterMode(mode){
  ymdFields.hidden = mode !== "ymd";
  rangeFields.hidden = mode !== "range";
  renderArchives();
}

root.addEventListener("click", event => {
  const toggle = event.target.closest(".archiveCardToggle");
  if(!toggle) return;
  const card = toggle.closest(".archiveIndexCard");
  const date = card?.dataset.archiveDate;
  if(!date) return;
  setArchiveOpen(date, toggle.getAttribute("aria-expanded") !== "true");
});

filterToggle.addEventListener("click", () => {
  const isOpen = filterToggle.getAttribute("aria-expanded") === "true";
  filterToggle.setAttribute("aria-expanded", String(!isOpen));
  filterPanel.hidden = isOpen;
  filterToggleMark.textContent = isOpen ? "＋" : "−";
});

sortSelect.addEventListener("change", renderArchives);
memberFilterInputs.forEach(input => input.addEventListener("change", renderArchives));
filterModeInputs.forEach(input => input.addEventListener("change", () => setFilterMode(input.value)));

yearSelect.addEventListener("change", () => {
  monthSelect.value = "";
  daySelect.value = "";
  populateMonths();
  populateDays();
  renderArchives();
});

monthSelect.addEventListener("change", () => {
  daySelect.value = "";
  populateDays();
  renderArchives();
});

daySelect.addEventListener("change", renderArchives);
startDateInput.addEventListener("change", renderArchives);
endDateInput.addEventListener("change", renderArchives);

clearFilter.addEventListener("click", () => {
  yearSelect.value = "";
  monthSelect.value = "";
  daySelect.value = "";
  startDateInput.value = "";
  endDateInput.value = "";
  const allMembersRadio = memberFilterInputs.find(input => input.value === "all");
  if(allMembersRadio) allMembersRadio.checked = true;
  populateMonths();
  populateDays();
  renderArchives();
});

const archiveHoverTooltip = document.createElement("div");
archiveHoverTooltip.className = "archiveHoverTooltip";
archiveHoverTooltip.setAttribute("role", "tooltip");
document.body.appendChild(archiveHoverTooltip);

const canHoverPrecisely = window.matchMedia("(hover: hover) and (pointer: fine)");
let activeTooltipTarget = null;

function positionArchiveTooltip(event){
  if(!archiveHoverTooltip.classList.contains("is-visible")) return;

  const gap = 14;
  const edge = 8;
  const rect = archiveHoverTooltip.getBoundingClientRect();
  let left = event.clientX + gap;
  let top = event.clientY + gap;

  if(left + rect.width > window.innerWidth - edge){
    left = Math.max(edge, event.clientX - rect.width - gap);
  }
  if(top + rect.height > window.innerHeight - edge){
    top = Math.max(edge, event.clientY - rect.height - gap);
  }

  archiveHoverTooltip.style.left = `${left}px`;
  archiveHoverTooltip.style.top = `${top}px`;
}

root.addEventListener("pointerover", event => {
  if(!canHoverPrecisely.matches) return;
  const target = event.target.closest("[data-archive-tooltip]");
  if(!target || !root.contains(target)) return;

  activeTooltipTarget = target;
  archiveHoverTooltip.textContent = target.dataset.archiveTooltip || "";
  archiveHoverTooltip.classList.add("is-visible");
  positionArchiveTooltip(event);
});

root.addEventListener("pointermove", event => {
  if(!activeTooltipTarget || !canHoverPrecisely.matches) return;
  positionArchiveTooltip(event);
});

root.addEventListener("pointerout", event => {
  if(!activeTooltipTarget) return;
  if(event.relatedTarget && activeTooltipTarget.contains(event.relatedTarget)) return;

  const leavingTarget = event.target.closest("[data-archive-tooltip]");
  if(leavingTarget !== activeTooltipTarget) return;

  activeTooltipTarget = null;
  archiveHoverTooltip.classList.remove("is-visible");
});

window.addEventListener("scroll", () => {
  activeTooltipTarget = null;
  archiveHoverTooltip.classList.remove("is-visible");
}, {passive:true, capture:true});

populateYears();
populateMonths();
populateDays();
setFilterMode("ymd");
openArchiveFromHash({scroll:true});
window.addEventListener("hashchange", () => openArchiveFromHash({scroll:true}));
</script>
</body>
</html>
