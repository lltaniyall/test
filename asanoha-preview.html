<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>麻の葉文様 Preview</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#A85C83">
<style>
  :root{--cream:#f4ede8;--plum:#6d4c61;--rose:#ccaaad}
  *{box-sizing:border-box}
  body{margin:0;padding:48px;background:var(--cream);font-family:serif;color:#342329}
  h1{font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;max-width:1000px}
  .sample{min-height:360px;border:1px solid rgba(109,76,97,.25);background-image:url("./assets/asanoha.png");background-size:120px 207.846px}
  .soft{opacity:.25}
  .plum{background-color:var(--plum);filter:none}
  .card{padding:24px;background:#fffaf5;border:1px solid rgba(109,76,97,.2)}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>麻の葉文様 Preview</h1>
<p>サイトへ組み込んでいる反復パターンの確認用ページです。</p>
<div class="grid">
  <div class="card"><h2>基本</h2><div class="sample"></div></div>
  <div class="card"><h2>薄く使用</h2><div class="sample soft"></div></div>
</div>
</body>
</html>
